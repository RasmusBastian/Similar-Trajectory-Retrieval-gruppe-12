# The database is exposed on localhost:5433 (not 5432) to avoid clashing with a locally installed PostgreSQL.
#
# Start everything:   docker compose up -d
# Stop:               docker compose down
# Reset the database: docker compose down -v   (then up again re-creates and re-imports)
#
# Ports can be changed in a .env file

name: trajectory-retrieval

services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: str
      POSTGRES_PASSWORD: str
      POSTGRES_DB: trajectories
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U str -d trajectories"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-off job: imports legacy/ CSV data into the database, then exits (skips if already imported)
  importer:
    build: ./python
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: str
      PGPASSWORD: str
      PGDATABASE: trajectories
    volumes:
      - ./legacy:/app/legacy:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/TrajectoryRetrieval.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=trajectories;Username=str;Password=str"
      Data__VertexCsv: /data/legacy/telchar/output/vertex.csv
      Data__EdgeConnectionsCsv: /data/legacy/telchar/output/edge_connections.csv
      Data__TravelTimeDirectory: /data/legacy/postprocessing/output
    ports:
      - "${API_PORT:-5038}:8080"
    volumes:
      - ./legacy:/data/legacy:ro
    depends_on:
      importer:
        condition: service_completed_successfully

  # One-off job: map-matches Beijing trajectories from the shared aSTEP database (astep-aau/data, on localhost:5432)
  # and saves them in bj_matched_trajectory. Not started by `up`, run with:
  #   docker compose run --rm --build mapmatching --limit 1000
  mapmatching:
    build: ./mapmatching
    profiles: [mapmatching]
    environment:
      SHARED_DATABASE_URL: ${SHARED_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/data}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: str
      PGPASSWORD: str
      PGDATABASE: trajectories
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db/init:/app/sql:ro
    depends_on:
      db:
        condition: service_healthy

  # One-off job: imports TSMini's inputs and outputs (TSMini/data, TSMini/exp) into the tsmini schema.
  # Not started by `up`, run with:
  #   docker compose run --rm --build tsmini-import              (add --replace to re-import)
  # The raw Rome trajectories are read from ROME_MATCHING_DIR/matching_result.csv (set it in .env).
  tsmini-import:
    build:
      context: ./TSMini
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir numpy==1.26.4 h5py==3.11.0 "psycopg[binary]"
        WORKDIR /app/TSMini
        ENTRYPOINT ["python", "import_to_db.py"]
    profiles: [tsmini]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: str
      PGPASSWORD: str
      PGDATABASE: trajectories
      ROME_MATCHING_CSV: /rome/matching_result.csv
    volumes:
      - ./TSMini:/app/TSMini:ro
      - ./db/init:/app/sql:ro
      - ${ROME_MATCHING_DIR:-../ST2Vec/data/rome/st_traj/st_traj}:/rome:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
