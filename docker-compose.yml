# The database is exposed on localhost:5433 (not 5432) to avoid clashing with a locally installed PostgreSQL.
#
# Start everything:   docker compose up -d
# Stop:               docker compose down
# Reset the database: docker compose down -v   (then up again creates the empty schemas)
#
# Ports can be changed in a .env file

name: trajectory-retrieval

services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: str
      POSTGRES_PASSWORD: str
      POSTGRES_DB: trajectories
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U str -d trajectories"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: src/TrajectoryRetrieval.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=trajectories;Username=str;Password=str"
    ports:
      - "${API_PORT:-5038}:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-off job: imports shared inputs (TSMini/data) into data and model outputs (TSMini/exp) into tsmini.
  # Not started by `up`, run with:
  #   docker compose run --rm --build tsmini-import              (add --replace to re-import)
  # ZIP import mounts a temporary extracted bundle here; no dataset copy is kept in the repository.
  tsmini-import:
    build:
      context: ./TSMini
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir numpy==1.26.4 h5py==3.11.0 "psycopg[binary]"
        WORKDIR /app/TSMini
        ENTRYPOINT ["python", "import_to_db.py"]
    profiles: [tsmini]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: str
      PGPASSWORD: str
      PGDATABASE: trajectories
      BEIJING_DATA_ROOT: /beijing/TSMini
    volumes:
      - ./TSMini:/app/TSMini:ro
      - ./db/init:/app/sql:ro
      - ${BEIJING_DATA_DIR:-.}:/beijing:ro
    depends_on:
      db:
        condition: service_healthy

  # One-off job: saves TrajCL's trained models, node2vec cell embeddings, logs and embeddings in the trajcl schema,
  # or writes them back to disk with --restore. Not started by `up`, run with:
  #   docker compose run --rm --build trajcl-import --prefix beijing_20200            (or rome_20200)
  #   docker compose run --rm --build trajcl-import --prefix beijing_20200 --restore  (add --force to overwrite)
  trajcl-import:
    build:
      context: ./TrajCL
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir numpy==1.26.4 h5py==3.11.0 "psycopg[binary]"
        WORKDIR /app/TrajCL
        ENTRYPOINT ["python", "import_to_db.py"]
    profiles: [trajcl]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: str
      PGPASSWORD: str
      PGDATABASE: trajectories
      TSMINI_ROOT: /app/TSMini
      BEIJING_DATA_ROOT: /beijing/TrajCL
    volumes:
      - ./TrajCL:/app/TrajCL
      - ./TSMini:/app/TSMini:ro
      - ./db/init:/app/sql:ro
      - ${BEIJING_DATA_DIR:-.}:/beijing:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
