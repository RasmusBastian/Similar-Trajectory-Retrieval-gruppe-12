# Builds the code and runs all tests on every push and pull request.
# Make it required for merging into main under Settings → Branches → Branch protection.
# Kode køres når der pushes til main og pulles fra main
# C# build and tests bygger hele løsningen (TrajectoryRetrieval.slnx) med .NET 10 og kører xUnit-testene
# TrajCL smoke test checks the model pipeline with synthetic data.
# Docker builds the API image after the checks pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: C# build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore frontend/src/TrajectoryRetrieval.Api/TrajectoryRetrieval.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/dotnet/TrajectoryRetrieval.Tests/TrajectoryRetrieval.Tests.csproj

      - name: Build API
        run: dotnet build frontend/src/TrajectoryRetrieval.Api/TrajectoryRetrieval.Api.csproj --no-restore -c Release

      - name: Build tests
        run: dotnet build tests/dotnet/TrajectoryRetrieval.Tests/TrajectoryRetrieval.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/dotnet/TrajectoryRetrieval.Tests/TrajectoryRetrieval.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

  trajcl:
    name: TrajCL smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/TrajCL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: models/TrajCL/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python smoke_test.py

  # Builds the images on every run, but only pushes them to ghcr.io on pushes to main
  # (i.e. after a merge), and only when the tests above have passed.
  docker:
    name: Docker image (${{ matrix.name }})
    needs: [dotnet, trajcl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: trajectory-api
            context: .
            dockerfile: frontend/src/TrajectoryRetrieval.Api/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest + the short commit id, e.g. ghcr.io/rasmusbastian/trajectory-api:ff6aa11
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
