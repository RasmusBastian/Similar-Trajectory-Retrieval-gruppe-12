apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-5-str-ingress
  namespace: project-5-str
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: project-5-str.cs-astep02.srv.aau.dk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: project-5-str-service
            port:
              number: 3030
